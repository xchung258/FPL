<!doctype html>
<html lang='en'>
<head>
  <meta charset='utf-8'>
  <title>FPL Standings</title>
  <link rel='stylesheet' href='css/style.css'>
</head>
<body>
  <h1>League Standings</h1>
  
  <div class='controls'>
    <label for='gwSelect' style='font-weight: bold; margin-right: 10px; color: #38003c;'>Select Week:</label>
    <select id='gwSelect' style='padding: 8px; border-radius: 4px; border: 1px solid #38003c; margin-right: 15px; font-weight: bold;'></select>
    
    <button id='loadBtn'>Refresh Data</button>
    <button id='sortTotal'>Sort by Total</button>
    <button id='sortGW'>Sort by GW Points</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Player</th>
        <th>Team</th>
        <th>GW Points</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id='standingsBody'></tbody>
  </table>
  <script src='js/app.js'></script>
</body>
</html>
